name: ニュースを取得して公開

on:
  push:
    branches: [main]
  schedule:
    # 30 分ごと（GitHub の混雑状況により数分〜十数分遅れることがあります）
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - name: RSS を取得
        run: npm run fetch
        env:
          # 取得に失敗したフィードは、公開中の前回データで補う
          PREVIOUS_DATA_URL: ${{ steps.pages.outputs.base_url }}/data/news.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
