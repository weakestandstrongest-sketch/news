<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="凪">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="広告のない、自分のためのニュースリーダー">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>凪 Nagi</title>
  <script>
    // 描画前にテーマと文字サイズを反映してちらつきを防ぐ
    try {
      const s = JSON.parse(localStorage.getItem('mynews:settings') || '{}');
      if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
      if (s.fontSize) document.documentElement.dataset.fontSize = s.fontSize;
      // ひび手帳の中で開いたときは、ひび手帳の明るさに合わせて黒い背景にする
      const q = new URLSearchParams(location.search);
      if (window.parent !== window && q.get('embed') === 'hibi') {
        document.documentElement.classList.add('in-hibi');
        if (/^(dark|light)$/.test(q.get('theme') || '')) document.documentElement.dataset.theme = q.get('theme');
      }
    } catch {}
  </script>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="masthead-row">
        <h1 class="brand" aria-label="凪 Nagi"><span class="brand-ja">凪</span><span class="brand-en">Nagi</span></h1>
        <div class="masthead-meta">
          <span id="today"></span>
          <span id="updated" class="updated"></span>
        </div>
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="カテゴリ"></nav>
    </header>

    <main class="views">
      <section class="view view-news is-active" data-view="news">
        <div class="pager" id="pager"></div>
      </section>

      <section class="view view-search" data-view="search" hidden>
        <div class="view-head">
          <h2 class="view-title">検索</h2>
          <label class="search-box">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <input id="search-input" type="search" placeholder="キーワードで記事を探す" enterkeyhint="search" autocomplete="off">
          </label>
        </div>
        <div class="scroll" id="search-results"></div>
      </section>

      <section class="view view-saved" data-view="saved" hidden>
        <div class="view-head">
          <h2 class="view-title">保存した記事</h2>
        </div>
        <div class="scroll" id="saved-list"></div>
      </section>

      <section class="view view-settings" data-view="settings" hidden>
        <div class="view-head">
          <h2 class="view-title">設定</h2>
        </div>
        <div class="scroll" id="settings"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="メニュー">
      <span class="tabbar-hl" aria-hidden="true"><i></i></span>
      <button class="tabbar-item is-active" data-target="news">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></svg>
        <span>ニュース</span>
      </button>
      <button class="tabbar-item" data-target="search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <span>検索</span>
      </button>
      <button class="tabbar-item" data-target="saved">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4h11v16l-5.5-4-5.5 4z"/></svg>
        <span>保存</span>
      </button>
      <button class="tabbar-item" data-target="settings">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <article class="reader" id="reader" aria-hidden="true">
    <div class="reader-bar">
      <button class="icon-btn" id="reader-back" aria-label="戻る">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
      </button>
      <div class="reader-actions">
        <button class="icon-btn" id="reader-share" aria-label="共有">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11M8 7.5l4-4 4 4"/><path d="M7 11H5.5v9.5h13V11H17"/></svg>
        </button>
        <button class="icon-btn" id="reader-save" aria-label="保存" aria-pressed="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4h11v16l-5.5-4-5.5 4z"/></svg>
        </button>
      </div>
    </div>
    <div class="reader-body scroll" id="reader-body"></div>
  </article>

  <div class="sheet" id="open-sheet" hidden>
    <div class="sheet-backdrop" data-sheet="cancel"></div>
    <div class="sheet-panel" role="dialog" aria-label="記事を開く">
      <div class="sheet-group">
        <p class="sheet-title">記事を開く</p>
        <button class="sheet-btn" data-sheet="nagi">凪で開く</button>
        <button class="sheet-btn" data-sheet="comet">Cometで開く</button>
      </div>
      <button class="sheet-btn sheet-cancel" data-sheet="cancel">キャンセル</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" type="module"></script>
<!-- ひび手帳（iPhone アプリ版）の中で開いたとき：下のバーを iPhone 本物の部品（Liquid Glass）にしてもらう。ここのバーは見えなくするだけ（場所はそのまま） -->
<style>html.hibi-nbar .tabbar{opacity:0!important}</style>
<script>
(function () {
  if (window.parent === window) return;
  var on = false, last = '', raf = 0, C = { bar: '.tabbar', items: '.tabbar .tabbar-item', label: 'span', key: function (el) { return el.dataset.target; }, active: function (el) { return el.classList.contains('is-active'); }, sym: { news: 'newspaper', search: 'magnifyingglass', saved: 'bookmark', settings: 'gearshape' } };
  var items = function () { return Array.prototype.slice.call(document.querySelectorAll(C.items)); };
  var keyOf = function (el, i) { return C.key ? C.key(el, i) : 'i' + i; };
  function state() {
    var list = items(), bar = document.querySelector(C.bar), hidden = !bar || !list.length || !bar.getClientRects().length;
    if (!hidden) {
      // something (an article, a sheet) is over our bar: then the iPhone's bar should go away too
      var probe = list.filter(C.active)[0] || list[0], r = probe.getBoundingClientRect();
      var hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
      hidden = !hit || !bar.contains(hit) || r.top > innerHeight;
    }
    var sel = '';
    var tabs = list.map(function (el, i) { var k = keyOf(el, i); if (C.active(el)) sel = k; var t = el.querySelector(C.label); return { key: k, title: (t ? t.textContent : el.textContent).trim(), symbol: C.sym[k] || 'circle' }; });
    var fab = C.fab && document.querySelector(C.fab);
    return { type: 'hibi:bar', tabs: tabs, selected: sel, fab: fab && fab.getClientRects().length ? C.fabSym : '', fabLabel: fab ? (fab.getAttribute('aria-label') || '') : '', hidden: hidden };
  }
  function send() { raf = 0; if (!on) return; var s = state(), j = JSON.stringify(s); if (j !== last) { last = j; parent.postMessage(s, '*'); } }
  function soon() { if (on && !raf) raf = requestAnimationFrame(send); }
  var mo = new MutationObserver(soon);
  addEventListener('message', function (e) {
    var d = e.data; if (e.source !== parent || !d) return;
    if (d.type === 'hibi:nbar') {
      on = !!d.on; last = '';
      document.documentElement.classList.toggle('hibi-nbar', on);
      mo.disconnect();
      if (on) { mo.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'aria-hidden', 'hidden', 'style', 'aria-current'] }); soon(); }
    } else if (d.type === 'hibi:tap' && on) {
      var el = d.fab ? document.querySelector(C.fab) : items().filter(function (x, i) { return keyOf(x, i) === d.key; })[0];
      if (el) el.click();
      soon();
    }
  });
  addEventListener('hashchange', soon);
  setInterval(soon, 500);
  parent.postMessage({ type: 'hibi:bar-hello' }, '*');
})();
</script>
</body>
</html>
